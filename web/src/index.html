<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Roastery</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Applies a saved theme before the first paint so a reload does not flash the system scheme.
      // Mirrors THEME_STORAGE_KEY in src/app/core/theme/theme.service.ts.
      try {
        var theme = localStorage.getItem('roastery.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
