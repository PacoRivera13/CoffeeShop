<div class="auth-page">
  <mat-card class="auth-card" appearance="outlined">
    <mat-card-content>
      <h1>Sign in</h1>

      <app-error-banner [error]="error()" />

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate data-testid="login-form">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" data-testid="login-email" />
          @if (form.controls.email.hasError('required')) {
            <mat-error>Email is required.</mat-error>
          } @else if (form.controls.email.hasError('email')) {
            <mat-error>Enter a valid email address.</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input
            matInput
            type="password"
            formControlName="password"
            autocomplete="current-password"
            data-testid="login-password"
          />
          @if (form.controls.password.hasError('required')) {
            <mat-error>Password is required.</mat-error>
          }
        </mat-form-field>

        <button mat-flat-button class="submit" type="submit" data-testid="login-submit" [disabled]="submitting()">
          Sign in
        </button>
      </form>

      <p class="alternate">New here? <a routerLink="/register" data-testid="register-link">Create an account</a></p>
    </mat-card-content>
  </mat-card>
</div>
