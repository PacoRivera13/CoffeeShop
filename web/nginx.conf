server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Same contract as the dev proxy (proxy.conf.json): /api/... reaches the API without the /api prefix.
  location /api/ {
    proxy_pass http://api:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed bundles never change, so they can be cached for a year.
  location ~* \.(?:js|css|woff2?|ttf|svg|png|ico)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Client-side routes fall back to index.html, which must always be revalidated to pick up new bundles.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
