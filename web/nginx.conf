server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Compress text assets: the bundles are ~4x smaller over the wire.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Docker's DNS, re-resolved every 10 s: a recreated api container gets a new IP.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Same contract as the dev proxy (proxy.conf.json): /api/... reaches the API without the /api prefix.
  location /api/ {
    # A variable makes nginx resolve the name per request instead of once at startup.
    set $api_upstream http://api:8080;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed bundles never change, so they can be cached for a year.
  location ~* \.(?:js|css|woff2?|ttf|svg|png|ico)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Client-side routes fall back to index.html, which must always be revalidated to pick up new bundles.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
